name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'website/data/movies.json'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push generated sitemap back to repo
      deployments: write    # cloudflare/pages-action needs this

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Node.js setup ───────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install script dependencies
        run: |
          cd scripts
          npm install --omit=dev

      # ── 3. Generate sitemap.xml + robots.txt ───────────────────────────────
      - name: Generate Sitemap
        run: node scripts/generate_sitemap.js
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://yoursite.lk' }}

      # ── 4. Commit generated files back to repo ─────────────────────────────
      - name: Commit generated sitemap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/sitemap.xml website/robots.txt
          git diff --cached --quiet || git commit -m "chore: regenerate sitemap [skip ci]"
          git push
        continue-on-error: true

      # ── 5. Deploy to Cloudflare Pages ─────────────────────────────────────
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:    ${{ secrets.CF_API_TOKEN }}
          accountId:   ${{ secrets.CF_ACCOUNT_ID }}
          projectName: filmsite
          directory:   website
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch:      ${{ github.ref_name }}

      # ── 6. Telegram notification ───────────────────────────────────────────
      - name: Notify Telegram on success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_NOTIFY_CHAT_ID }}" \
            -d text="✅ FilmSite deployed!%0A🕐 $(date '+%Y-%m-%d %H:%M') UTC%0A🔗 ${{ vars.SITE_BASE_URL }}" \
            || true

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_NOTIFY_CHAT_ID }}" \
            -d text="❌ FilmSite deploy FAILED%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
